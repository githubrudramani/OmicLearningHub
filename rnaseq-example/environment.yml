# Versioned environment for OmicLearningHub Module 2 (bulk RNA-seq).
# Create:  micromamba create -f environment.yml   (or: conda env create -f environment.yml)
# Use:     micromamba activate omiclearninghub-rnaseq
# R is pinned; the solver picks one consistent Bioconductor release for it.
# The exact versions of the last verified run are in environment_lock.yml.
name: omiclearninghub-rnaseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5
  - bioconductor-limma
  - bioconductor-edger
  - bioconductor-glimma
  - bioconductor-org.mm.eg.db
  - bioconductor-fgsea
  - bioconductor-clusterprofiler
  - r-msigdbr
  - r-data.table
  - r-ggplot2
  - r-pheatmap
  - r-r.utils
